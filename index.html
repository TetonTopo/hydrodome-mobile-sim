<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Moat — Site Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#080b0e;color:#e6edf3;
    font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #ui{position:absolute;inset:0;pointer-events:none;z-index:5}

  /* ---- brand lockup, top left ---- */
  .brand{position:absolute;top:30px;left:34px;display:flex;align-items:center;gap:14px}
  .brand .mark{width:5px;height:42px;background:#db6d28;border-radius:3px;box-shadow:0 0 18px #db6d2899}
  .brand .wd{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:26px;letter-spacing:7px;color:#fff;
    line-height:1;text-shadow:0 2px 16px rgba(0,0,0,.95)}
  .brand .wd em{font-style:normal;color:#39d2c0}
  .brand .sb{font-size:12.5px;letter-spacing:3.4px;text-transform:uppercase;color:#a6b0b8;margin-top:7px;
    text-shadow:0 2px 12px rgba(0,0,0,.95)}

  /* ---- caption block, bottom left ---- */
  .cap{position:absolute;left:34px;bottom:44px;max-width:46%}
  .cap .step{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:4.5px;color:#39d2c0;
    text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:11px}
  .cap .step i{display:block;width:26px;height:2px;background:#39d2c0;opacity:.75}
  .cap h1{font-size:40px;line-height:1.08;font-weight:800;letter-spacing:-.6px;
    text-shadow:0 3px 26px rgba(0,0,0,.85);margin-bottom:11px}
  .cap p{font-size:19px;line-height:1.45;color:#c2ccd4;text-shadow:0 2px 16px rgba(0,0,0,.9);max-width:30em}
  .cap p b{color:#fff;font-weight:600}
  .fadein{opacity:0;transform:translateY(14px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.2,1)}
  .fadein.on{opacity:1;transform:none}
  html.nofx *{transition:none!important}

  /* ---- readouts, top right ---- */
  .rail{position:absolute;top:30px;right:34px;width:252px;text-align:right}
  .lbl{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:2.6px;color:#8d979f;
    text-transform:uppercase;margin-bottom:6px;text-shadow:0 2px 10px rgba(0,0,0,.9)}
  .grp{margin-bottom:16px;opacity:0;transition:opacity .5s ease}
  .grp.on{opacity:1}
  .num{font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:700;line-height:1;color:#fff;
    text-shadow:0 2px 14px rgba(0,0,0,.95)}
  .num u{text-decoration:none;font-size:15px;color:#96a0a8;margin-left:5px;letter-spacing:1px}
  .num.teal{color:#39d2c0}
  .num small{font-size:20px;color:#8d979f;font-weight:500}

  /* ---- class bars ---- */
  .classes{margin-top:14px;opacity:0;transition:opacity .6s ease}
  .classes.on{opacity:1}
  .cl{display:grid;grid-template-columns:1fr 96px;gap:10px;align-items:center;margin-bottom:6px}
  .cl .bw{height:10px;background:#00000066;border:1px solid #ffffff1f;border-radius:2px;overflow:hidden}
  .cl .bw i{display:block;height:100%;width:0;border-radius:1px;transition:width 1.4s cubic-bezier(.2,.7,.2,1)}
  .cl .t{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#c3cdd4;text-align:left;letter-spacing:.3px;
    white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.95)}
  .cl .t b{color:#7f8990;font-weight:400;margin-left:4px}

  /* ---- tower ledger, lower right ---- */
  .ledger{position:absolute;right:34px;bottom:44px;width:252px;opacity:0;transition:opacity .6s ease}
  .ledger.on{opacity:1}
  .lg{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;margin-bottom:8px;
    font-family:'JetBrains Mono',monospace;font-size:12.5px;transition:opacity .45s ease;
    text-shadow:0 2px 8px rgba(0,0,0,.95)}
  .lg .id{color:#39d2c0;font-weight:700}
  .lg .v{text-align:right;color:#c9d1d9}
  .lg .bw{height:9px;background:#00000066;border:1px solid #ffffff1a;border-radius:2px;overflow:hidden;display:flex}
  .lg .bw i{display:block;height:100%;transition:width .9s cubic-bezier(.2,.7,.2,1)}
  .lg.shed{opacity:.28}
  .lg.shed .id{color:#f85149}

  /* ---- footer + progress ---- */
  .foot{position:absolute;left:34px;bottom:19px;font-family:'JetBrains Mono',monospace;font-size:10.5px;
    letter-spacing:2.6px;color:#57616a;text-transform:uppercase}
  .prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:#ffffff12}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,#39d2c0,#db6d28);width:0}

  /* ?chrome=0 — the deck supplies its own title and footer */
  html.nochrome .brand, html.nochrome .foot{display:none}
  html.nochrome .rail{top:26px}

  @media (max-width:900px){
    .brand .wd{font-size:20px;letter-spacing:5px}
    .cap h1{font-size:27px}.cap p{font-size:15px}.cap{max-width:64%}
    .classes,.ledger{display:none}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div class="brand">
    <div class="mark"></div>
    <div>
      <div class="wd">THE <em>MOAT</em></div>
      <div class="sb">Site analysis &middot; block-out v0</div>
    </div>
  </div>

  <div class="rail">
    <div class="classes" id="cls">
      <div class="lbl">Ground classes</div>
    </div>
  </div>

  <div class="ledger" id="led">
    <div class="lbl" id="ledlbl">Per tower &middot; protected / wasted</div>
  </div>

  <div class="cap">
    <div class="step fadein" id="cstep"><i></i><span></span></div>
    <h1 class="fadein" id="chead"></h1>
    <p class="fadein" id="cbody"></p>
  </div>

  <div class="foot">The Moat&trade; &middot; Carmanah Wildfire &middot; Maple Bay, North Cowichan BC</div>
  <div class="prog"><i id="prog"></i></div>
</div>

<script src="site.js"></script>
<script>
(function(){
"use strict";
var S = window.SITE;
var SW = S.site.width_m, SH = S.site.height_m;
var THROW = S.throw;                       // 50 m
var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
// embedded in the deck, the slide carries the title — drop our own lockup
if(/[?&]chrome=0(?:&|$)/.test(location.search)) document.documentElement.classList.add('nochrome');

/* ---------------------------------------------------------------- utils */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function smooth(t){ t=clamp(t,0,1); return t*t*(3-2*t); }
function seq(t,t0,d){ return smooth((t-t0)/d); }
function track(t,kfs){
  if(t<=kfs[0][0]) return kfs[0][1];
  for(var i=1;i<kfs.length;i++){
    if(t<=kfs[i][0]){
      var a=kfs[i-1], b=kfs[i];
      return lerp(a[1],b[1],smooth((t-a[0])/(b[0]-a[0])));
    }
  }
  return kfs[kfs.length-1][1];
}
function fy(y){ return SH - y; }           // world metres (y up) -> screen-down metres
function flipRing(r){ var o=new Array(r.length); for(var i=0;i<r.length;i++) o[i]=[r[i][0],fy(r[i][1])]; return o; }

/* ------------------------------------------------------------- geometry */
var BLD = S.buildings.map(function(b){
  var r = flipRing(b.pts), cx=0, cy=0;
  for(var i=0;i<r.length-1;i++){ cx+=r[i][0]; cy+=r[i][1]; }
  var n = Math.max(1,r.length-1);
  return { r:r, c:[cx/n,cy/n], area:b.area, cov:false, tw:-1 };
});
var ROADS = S.roads.map(function(r){ return { cls:r.cls, pts:flipRing(r.pts) }; });
var WATER = flipRing(S.water);
var WOODS = S.woods.map(flipRing);
var GRASS = S.grass.map(flipRing);
var ROADLINE = S.line_geom.map(flipRing);   // the street the line stands on

var TW = S.towers.map(function(t){
  return { id:t.id, x:t.x, y:fy(t.y), road:t.road, arc:t.arc,
           structure_m2:t.structure_m2, structures:t.structures,
           waste:t.waste_full, wasteArc:t.waste_arc };
});
// ranking, same rule as the block-out demo: structure covered first, least waste second
var RANKED = TW.slice().sort(function(a,b){
  if(b.structure_m2!==a.structure_m2) return b.structure_m2-a.structure_m2;
  return a.waste-b.waste;
});
RANKED.forEach(function(t,i){ t.rank=i+1; });
var MAX_STRUCT = RANKED[0].structure_m2 || 1;
var KEEP = Math.max(1, TW.length - 2);      // how many the intake can feed when supply drops

BLD.forEach(function(b){
  var best=-1, bd=1e9;
  for(var i=0;i<TW.length;i++){
    var d = Math.hypot(b.c[0]-TW[i].x, b.c[1]-TW[i].y);
    if(d<=THROW && d<bd){ bd=d; best=i; }
  }
  if(best>=0){ b.cov=true; b.tw=best; }
});
BLD.forEach(function(b,i){ b.k = ((i*2654435761)%1000)/1000; });

// the tower line itself, north to south
var LINE_PTS = TW.map(function(t){ return [t.x, t.y]; });
var LINE_MID_Y = (TW[0].y + TW[TW.length-1].y)/2;

/* --------------------------------------------------------------- canvas */
var cv = document.getElementById('c'), ctx = cv.getContext('2d');
var W=0, H=0, DPR=1;
var wet = document.createElement('canvas'), wctx = wet.getContext('2d');
// sweeps are composited here first, so where two of them overlap the ground does
// not go twice as bright — the line reads as one wetted ribbon, not five slices
var fx = document.createElement('canvas'), fxc = fx.getContext('2d');
var WET_K = 1600/SW;
wet.width = Math.round(SW*WET_K); wet.height = Math.round(SH*WET_K);
function clearWet(){ wctx.setTransform(1,0,0,1,0,0); wctx.clearRect(0,0,wet.width,wet.height); }

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  fx.width = cv.width; fx.height = cv.height;
}
window.addEventListener('resize', resize);

var imgOrtho = new Image(), imgBlk = new Image(), ready=0;
imgOrtho.onload = imgBlk.onload = function(){ ready++; };
imgOrtho.src = 'assets/imagery.jpg';
imgBlk.src   = 'assets/blockout.png';

/* -------------------------------------------------------------- camera */
var LOOP = 88;
var TARGET_W = 900;                        // world metres across the frame at z = 1
var WEST_EDGE = -300;                      // we allow the view past the west edge of the
                                           // imagery; that strip is drawn as the wildland
function camera(t){
  var z  = REDUCED ? 1.04 : track(t,[[0,1.00],[18,1.03],[29,1.05],[38,1.09],[52,1.10],[70,1.13],[83,1.11],[86,1.02],[LOOP,1.00]]);
  var cx = track(t,[[0,470],[18,450],[29,415],[38,120],[52,118],[70,112],[83,116],[86,450],[LOOP,470]]);
  var cy = track(t,[[0,300],[18,300],[29,292],[38,268],[52,274],[70,280],[83,286],[86,300],[LOOP,300]]);
  var s  = Math.max(W/TARGET_W, H/SH) * z;
  var vw = W/s, vh = H/s;
  cx = vw>=SW-WEST_EDGE ? (SW+WEST_EDGE)/2 : clamp(cx, vw/2 + WEST_EDGE, SW-vw/2);
  cy = vh>=SH ? SH/2 : clamp(cy, vh/2, SH-vh/2);
  return { s:s, cx:cx, cy:cy };
}
function applyCam(c,g){
  g.setTransform(DPR,0,0,DPR,0,0);
  g.translate(W/2,H/2); g.scale(c.s,c.s); g.translate(-c.cx,-c.cy);
}

/* ------------------------------------------------------------ the film */
var SCENES = [
  { t:0.6,  step:'The site',      head:'A site, as the truck sees it',
    body:'A map, a rough idea of where the fire will come from, and the operator&rsquo;s own eyes.' },
  { t:10,   step:'Step 01', head:'Most of the answer already exists',
    body:'Building footprints, streets, water. All of it public, none of it flown.' },
  { t:20,   step:'Step 02', head:'Every pixel gets a class',
    body:'Structure, pavement, water, canopy, fine fuel, bare ground.' },
  { t:31,   step:'Step 03', head:'The fire is coming out of the west',
    body:'That decides everything downstream. The line goes <b>between the wildland and the town</b>.' },
  { t:40,   step:'Step 04', head:'Towers stand on the road',
    body:'On the last street with the town behind it &mdash; spaced by what they cover, not by a grid.' },
  { t:50,   step:'Step 05', head:'What each tower is actually protecting',
    body:'Buildings inside the throw, weighed against water thrown at road, water and open ground.' },
  { t:59,   step:'Step 06', head:'Structure first. Least waste second.',
    body:'When the intake cannot feed them all, the towers covering the least shed first.' },
  { t:68,   step:'Step 07', head:'Each gun sweeps the half it is there for',
    body:'Two reverse stops, set by hand. <b>Half the ground wetted</b>, and none of it thrown back at the fire.' },
  { t:77,   step:'Step 08', head:'A wet line, on a fraction of the water',
    body:'Two towers at a time, rotating, holding the flank the embers arrive on.' }
];

var els = {
  step: document.querySelector('#cstep span'), stepBox: document.getElementById('cstep'),
  head: document.getElementById('chead'), body: document.getElementById('cbody'),
  cls: document.getElementById('cls'), led: document.getElementById('led'),
  ledlbl: document.getElementById('ledlbl'), prog: document.getElementById('prog')
};

var CLASS_COLOR = { canopy:'#2a7a44', water:'#3878c8', bare:'#b9a98e', pavement:'#8f9499',
                    fine_fuel:'#d2ad3f', structure:'#e24b33', unknown:'#c9c9c9' };
var CLASS_NAME  = { canopy:'canopy', water:'water', bare:'bare', pavement:'pavement',
                    fine_fuel:'fine fuel', structure:'structure', unknown:'unclassified' };
var clsBars = [];
Object.keys(S.class_pct).sort(function(a,b){ return S.class_pct[b]-S.class_pct[a]; }).forEach(function(k){
  var row = document.createElement('div'); row.className='cl';
  row.innerHTML = '<div class="bw"><i style="background:'+CLASS_COLOR[k]+'"></i></div>'+
                  '<div class="t">'+CLASS_NAME[k]+'</div>';
  els.cls.appendChild(row);
  clsBars.push({ el: row.querySelector('i'), pct: S.class_pct[k] });
});
var ledRows = RANKED.map(function(t){
  var row = document.createElement('div'); row.className='lg';
  row.innerHTML = '<div class="id">T'+t.id+'</div>'+
    '<div class="bw"><i style="background:#39d2c0"></i><i style="background:#f85149"></i></div>';
  els.led.appendChild(row);
  var bars = row.querySelectorAll('i');
  return { el:row, t:t, sBar:bars[0], wBar:bars[1] };
});

var lastScene = -1, barsFilled = false, ledgerFilled = false, ledgerArc = false;
function setScene(i){
  if(i===lastScene) return;
  lastScene = i;
  var s = SCENES[i];
  [els.stepBox, els.head, els.body].forEach(function(e){ e.classList.remove('on'); });
  setTimeout(function(){
    if(lastScene!==i) return;
    els.step.innerHTML = s.step; els.head.innerHTML = s.head; els.body.innerHTML = s.body;
    els.stepBox.classList.add('on');
    setTimeout(function(){ if(lastScene===i) els.head.classList.add('on'); }, 90);
    setTimeout(function(){ if(lastScene===i) els.body.classList.add('on'); }, 190);
  }, 260);
}

/* ------------------------------------------------------------- drawing */
function ring(g, r, close){
  g.beginPath(); g.moveTo(r[0][0], r[0][1]);
  for(var i=1;i<r.length;i++) g.lineTo(r[i][0], r[i][1]);
  if(close) g.closePath();
}
function drawImageLayer(g, im, a){
  if(a<=0.002 || !im.complete || !im.naturalWidth) return;
  g.globalAlpha = a; g.drawImage(im, 0, 0, SW, SH); g.globalAlpha = 1;
}
function bear(d){ return (d-90)*Math.PI/180; }   // bearing (0 = N, clockwise) -> canvas angle

var FADE = [[83,1],[86,0]];                      // every overlay leaves together

function drawVectors(g, t, cam){
  var reveal = seq(t, 10, 3.4);
  var aVec   = track(t,[[9.6,0],[12,1],[19,1],[23,0.5],[29,0.42],[83,0.42],[86,0]]);
  if(aVec<=0.002) return;
  var px = 1/cam.s;

  g.globalAlpha = aVec*0.5;
  g.fillStyle='#1b4f86'; ring(g,WATER,true); g.fill();
  g.fillStyle='#24532f'; WOODS.concat(GRASS).forEach(function(r){ ring(g,r,true); g.fill(); });

  g.strokeStyle='#9fb0bd'; g.lineCap='round'; g.lineJoin='round';
  ROADS.forEach(function(r,i){
    var f = clamp(reveal*1.6 - (i/ROADS.length)*0.5, 0, 1);
    if(f<=0.01) return;
    g.lineWidth = (r.cls==='tertiary'?3.4:r.cls==='residential'?2.4:1.5)*px*1.35;
    g.globalAlpha = aVec*0.85*f;
    ring(g,r.pts,false); g.stroke();
  });

  g.lineWidth = 1.35*px;
  for(var i=0;i<BLD.length;i++){
    var b = BLD[i];
    var f = clamp(reveal*1.9 - b.k*0.85, 0, 1);
    if(f<=0.01) continue;
    var lit = b.cov ? track(t,[[50,0],[53,1],[83,1],[86,0]]) : 0;
    g.globalAlpha = aVec*f;
    ring(g, b.r, true);
    g.fillStyle = lit>0.02 ? 'rgba(57,210,192,'+(0.20+0.30*lit)+')' : 'rgba(226,75,51,0.30)';
    g.fill();
    g.strokeStyle = lit>0.02 ? 'rgba(120,255,238,'+(0.55+0.4*lit)+')' : 'rgba(255,150,120,0.55)';
    g.stroke();
  }
  g.globalAlpha = 1;
}

/* the wildland off the west edge of the imagery, and the threat coming out of it */
function drawThreat(g, t, cam){
  var a = track(t,[[32,0],[35,1],[83,1],[86,0]]);
  if(a<=0.01) return;
  var px = 1/cam.s;
  var x1 = 8, x0 = WEST_EDGE - 90;

  g.save();
  g.globalAlpha = a;
  // the band itself
  var grad = g.createLinearGradient(x0,0,x1,0);
  grad.addColorStop(0,'rgba(24,10,4,0.96)');
  grad.addColorStop(0.72,'rgba(38,16,6,0.86)');
  grad.addColorStop(1,'rgba(40,18,8,0)');
  g.fillStyle = grad; g.fillRect(x0, -200, x1-x0, SH+400);
  // diagonal hatch
  g.save();
  g.beginPath(); g.rect(x0, -200, x1-x0, SH+400); g.clip();
  g.strokeStyle='rgba(219,109,40,0.16)'; g.lineWidth=2.2*px;
  for(var hx=x0-SH; hx<x1+SH; hx+=26){
    g.beginPath(); g.moveTo(hx,-200); g.lineTo(hx+SH+400, SH+200); g.stroke();
  }
  g.restore();
  // the edge
  g.strokeStyle='rgba(255,140,58,0.85)'; g.lineWidth=3*px;
  g.beginPath(); g.moveTo(x1,-200); g.lineTo(x1,SH+200); g.stroke();

  // arrows pushing east
  var drift = REDUCED ? 0 : (t*7) % 46;
  for(var k=-1;k<9;k++){
    var ay = LINE_MID_Y - 320 + k*82;
    for(var m=0;m<3;m++){
      var ax = x0 + 26 + m*46 + drift;
      if(ax > x1-14) continue;
      g.globalAlpha = a*(0.30+0.22*m);
      g.strokeStyle='#ff8c3a'; g.lineWidth=2.6*px; g.lineCap='round'; g.lineJoin='round';
      g.beginPath();
      g.moveTo(ax, ay); g.lineTo(ax+22, ay);
      g.moveTo(ax+13, ay-7); g.lineTo(ax+22, ay); g.lineTo(ax+13, ay+7);
      g.stroke();
    }
  }

  // label, upright in the band
  g.globalAlpha = a;
  g.textAlign='left'; g.textBaseline='middle';
  g.fillStyle='#ff8c3a';
  g.font='700 '+(15*px*1.6)+'px "JetBrains Mono",monospace';
  var tx = x1 - 250;                             // always inside the frame
  g.fillText('WILDFIRE THREAT', tx, LINE_MID_Y-14*px*1.6);
  g.fillStyle='rgba(255,196,150,0.95)';
  g.font='500 '+(13*px*1.6)+'px "JetBrains Mono",monospace';
  g.fillText('FROM THE WEST', tx, LINE_MID_Y+8*px*1.6);
  g.restore();
  g.globalAlpha = 1;
}

/* the street the line stands on */
function drawRoadLine(g, t, cam){
  var a = track(t,[[39.4,0],[41.4,1],[83,1],[86,0]]);
  if(a<=0.01) return;
  var px = 1/cam.s;
  var grow = seq(t, 39.6, 1.8);
  g.globalAlpha = a*0.9;
  g.lineCap='round'; g.lineJoin='round';
  ROADLINE.forEach(function(seg){
    var total=0, d=[];
    for(var i=1;i<seg.length;i++){ var l=Math.hypot(seg[i][0]-seg[i-1][0],seg[i][1]-seg[i-1][1]); d.push(l); total+=l; }
    var want=total*grow, acc=0;
    g.beginPath(); g.moveTo(seg[0][0], seg[0][1]);
    for(var j=1;j<seg.length;j++){
      if(acc+d[j-1]<=want){ g.lineTo(seg[j][0],seg[j][1]); acc+=d[j-1]; }
      else { var f=(want-acc)/d[j-1];
        g.lineTo(lerp(seg[j-1][0],seg[j][0],f), lerp(seg[j-1][1],seg[j][1],f)); break; }
    }
    g.strokeStyle='rgba(57,210,192,0.18)'; g.lineWidth=20*px; g.stroke();
    g.strokeStyle='rgba(57,210,192,0.85)'; g.lineWidth=3.4*px; g.stroke();
  });
  g.globalAlpha = 1;
}

function towerAlpha(t,i){
  var t0 = 40.6 + i*0.5;
  return track(t,[[t0,0],[t0+0.6,1],[83,1],[86,0]]);
}
function shedCount(t){
  return track(t,[[60.5,TW.length],[63,KEEP],[66,KEEP],[67.5,TW.length]]);
}
function rankOn(t){ return track(t,[[58.6,0],[61,1],[67,1],[69,0]]); }

// an annular sector: a big gun does not wet its own base, and the far edge of the
// pattern feathers out rather than stopping at a line
var R_IN = 11;
function sweepPath(g, cx, cy, a0, a1, r0, r1){
  g.beginPath();
  g.arc(cx, cy, r1, a0, a1);
  g.arc(cx, cy, r0, a1, a0, true);
  g.closePath();
}
function sweepFill(g, cx, cy, r0, r1){
  var gr = g.createRadialGradient(cx, cy, r0, cx, cy, r1);
  gr.addColorStop(0,    'rgba(57,210,192,0.10)');
  gr.addColorStop(0.30, 'rgba(70,225,205,0.46)');
  gr.addColorStop(0.80, 'rgba(70,225,205,0.50)');
  gr.addColorStop(1,    'rgba(90,235,215,0.06)');
  return gr;
}

function drawCoverage(g, t, cam){
  var px = 1/cam.s;
  var aCirc = track(t,[[49.4,0],[51.4,1],[68,1],[71,0]]);
  var aArc  = track(t,[[68.5,0],[71.5,1],[83,1],[86,0]]);
  var shed  = shedCount(t), rk = rankOn(t);

  // reach: the whole circle, drawn light — this is what the gun could wet
  if(aCirc>0.01){
    for(var i=0;i<TW.length;i++){
      var tw=TW[i], a=towerAlpha(t,i);
      if(a<=0.01) continue;
      var isShed = tw.rank > Math.round(shed);
      var dim = isShed ? lerp(1, 0.18, rk) : 1;
      var bloom = seq(t, 49.6 + i*0.22, 1.1);
      var r = THROW*bloom;
      g.globalAlpha = aCirc*a*dim;
      g.beginPath(); g.arc(tw.x,tw.y,r,0,Math.PI*2);
      g.fillStyle='rgba(57,210,192,0.10)'; g.fill();
      g.strokeStyle='rgba(6,16,19,0.5)'; g.lineWidth=4.4*px; g.stroke();
      g.strokeStyle='rgba(112,247,231,0.9)'; g.lineWidth=1.9*px; g.stroke();
      if(bloom<1){
        g.globalAlpha = aCirc*a*dim*(1-bloom);
        g.beginPath(); g.arc(tw.x,tw.y, r*1.12, 0, Math.PI*2);
        g.strokeStyle='rgba(180,255,246,0.9)'; g.lineWidth=2.4*px; g.stroke();
      }
    }
    g.globalAlpha=1;
  }

  // the sweep: what the operator actually sets, and the ground it wets
  if(aArc>0.01){
    fxc.setTransform(1,0,0,1,0,0);
    fxc.clearRect(0,0,fx.width,fx.height);
    applyCam(cam, fxc);
    var any = false;
    for(var j=0;j<TW.length;j++){
      var tj=TW[j], aj=towerAlpha(t,j);
      if(aj<=0.01) continue;
      var sweep = seq(t, 68.8 + j*0.2, 1.4);
      if(sweep<=0.01) continue;
      any = true;
      // the two stops close in on the recommended window from the full circle
      var span = lerp(360, tj.arc.span, sweep);
      var st   = bear(lerp(tj.arc.start - (360-tj.arc.span)/2, tj.arc.start, sweep));
      fxc.globalAlpha = aj;
      sweepPath(fxc, tj.x, tj.y, st, st+span*Math.PI/180, R_IN, THROW);
      fxc.fillStyle = sweepFill(fxc, tj.x, tj.y, R_IN, THROW);
      fxc.fill();
    }
    if(any){
      g.setTransform(1,0,0,1,0,0);
      g.globalAlpha = aArc;
      g.drawImage(fx, 0, 0);
      g.globalAlpha = 1;
      applyCam(cam, g);
    }
    // outline and the two reverse stops, on top
    for(var k=0;k<TW.length;k++){
      var tk=TW[k], ak=towerAlpha(t,k);
      if(ak<=0.01) continue;
      var sw = seq(t, 68.8 + k*0.2, 1.4);
      if(sw<=0.01) continue;
      var isShedK = tk.rank > Math.round(shed);
      var dimK = isShedK ? lerp(1,0.18,rk) : 1;
      var spanK = lerp(360, tk.arc.span, sw);
      var stK   = bear(lerp(tk.arc.start - (360-tk.arc.span)/2, tk.arc.start, sw));
      var endK  = stK + spanK*Math.PI/180;
      g.globalAlpha = aArc*ak*dimK;
      g.beginPath(); g.arc(tk.x, tk.y, THROW, stK, endK);
      g.strokeStyle='rgba(150,255,243,0.75)'; g.lineWidth=1.8*px; g.stroke();
      // reverse stops
      g.lineCap='round';
      [stK, endK].forEach(function(ang){
        var ca=Math.cos(ang), sa=Math.sin(ang);
        g.beginPath();
        g.moveTo(tk.x + ca*THROW*0.80, tk.y + sa*THROW*0.80);
        g.lineTo(tk.x + ca*THROW*1.10, tk.y + sa*THROW*1.10);
        g.strokeStyle='rgba(190,255,248,0.95)'; g.lineWidth=2.6*px; g.stroke();
      });
    }
    g.globalAlpha=1;
  }
}

var firedUpTo = -1;
function drawDuty(g, t, cam){
  var a = track(t,[[76.4,0],[78.5,1],[83,1],[86,0]]);
  if(a<=0.01) return;
  var px = 1/cam.s;
  var slot = Math.floor((t-76.4)/1.15);
  var n = TW.length;
  var active = [ ((slot*2)%n+n)%n, ((slot*2+1)%n+n)%n ];

  if(slot>firedUpTo && slot>=0){
    firedUpTo = slot;
    wctx.setTransform(WET_K,0,0,WET_K,0,0);
    active.forEach(function(idx){
      var tw=TW[idx], st=bear(tw.arc.start);
      sweepPath(wctx, tw.x, tw.y, st, st+tw.arc.span*Math.PI/180, R_IN, THROW);
      wctx.fillStyle='rgba(88,166,255,0.15)'; wctx.fill();
    });
  }

  active.forEach(function(idx){
    var tw=TW[idx], st=bear(tw.arc.start), en=st+tw.arc.span*Math.PI/180;
    var pulse = 0.55+0.45*Math.sin(t*5.5);
    g.globalAlpha = a*(0.42+0.32*pulse);
    sweepPath(g, tw.x, tw.y, st, en, R_IN, THROW);
    var gr = g.createRadialGradient(tw.x,tw.y,R_IN, tw.x,tw.y,THROW);
    gr.addColorStop(0,'rgba(88,166,255,0.10)');
    gr.addColorStop(0.32,'rgba(120,200,255,0.42)');
    gr.addColorStop(0.82,'rgba(120,200,255,0.46)');
    gr.addColorStop(1,'rgba(150,220,255,0.05)');
    g.fillStyle=gr; g.fill();
    g.globalAlpha = a*0.9;
    g.beginPath(); g.arc(tw.x,tw.y,THROW,st,en);
    g.strokeStyle='rgba(180,230,255,0.9)'; g.lineWidth=2.2*px; g.stroke();
    g.globalAlpha = a;
    g.beginPath(); g.arc(tw.x,tw.y, 10*px, 0, Math.PI*2);
    g.fillStyle='#f85149'; g.fill();
  });
  g.globalAlpha=1;
}

function drawTowers(g, t, cam){
  var px = 1/cam.s;
  var rk = rankOn(t), shed = shedCount(t);
  for(var i=0;i<TW.length;i++){
    var tw=TW[i], a=towerAlpha(t,i);
    if(a<=0.01) continue;
    var isShed = tw.rank > Math.round(shed);
    var dim = isShed ? lerp(1,0.3,rk) : 1;
    var pop = seq(t, 40.6+i*0.5, 0.6);

    g.globalAlpha = a*dim;
    if(pop<1){
      g.beginPath(); g.arc(tw.x,tw.y, lerp(30,10,pop)*px*2.2, 0, Math.PI*2);
      g.strokeStyle='rgba(57,210,192,'+(1-pop)+')'; g.lineWidth=2*px; g.stroke();
    }
    g.beginPath(); g.arc(tw.x, tw.y, 10*px, 0, Math.PI*2);
    g.fillStyle = isShed && rk>0.5 ? '#f85149' : '#39d2c0';
    g.strokeStyle='#0b1013'; g.lineWidth=2*px; g.fill(); g.stroke();

    var lx = tw.x + 15*px, ly = tw.y - 14*px;
    g.textAlign='left'; g.textBaseline='middle';
    g.font='500 '+(13*px*1.6)+'px "JetBrains Mono", monospace';
    g.lineWidth = 3.4*px; g.strokeStyle='rgba(6,10,13,0.92)';
    var lbl = 'T'+tw.id + (rk>0.35 ? '  #'+tw.rank : '');
    g.strokeText(lbl, lx, ly);
    g.fillStyle = isShed && rk>0.5 ? '#f85149' : '#cfe9e6';
    g.fillText(lbl, lx, ly);
  }
  g.globalAlpha=1;
}

var EMB=[]; for(var e=0;e<70;e++) EMB.push({ x:Math.random()*340+WEST_EDGE-90, y:Math.random()*SH, v:7+Math.random()*16, r:Math.random()*1.6+0.6, p:Math.random() });
function drawEmbers(g, t, cam){
  var a = track(t,[[34,0],[38,0.7],[83,0.7],[86,0]]);
  if(a<=0.01 || REDUCED) return;
  var px = 1/cam.s;
  for(var i=0;i<EMB.length;i++){
    var m=EMB[i];
    var x = m.x + ((t*m.v) % 380);
    var y = m.y + Math.sin(t*0.9+m.p*9)*7;
    g.globalAlpha = a*(0.22+0.45*Math.abs(Math.sin(t*2+m.p*7)));
    g.beginPath(); g.arc(x, y, m.r*px*2.2, 0, Math.PI*2);
    g.fillStyle='#ffb067'; g.fill();
  }
  g.globalAlpha=1;
}

/* --------------------------------------------------------------- render */
var t0 = performance.now()/1000, prevLoopN = 0, paused = false;

function frame(){
  requestAnimationFrame(frame);
  if(document.hidden || paused) return;
  var abs = performance.now()/1000 - t0;
  render(abs % LOOP, Math.floor(abs/LOOP));
}

function render(t, loopN){
  if(!W || cv.clientWidth!==W || cv.clientHeight!==H) resize();
  if(ready<2) return;

  if(loopN!==prevLoopN){
    prevLoopN = loopN; firedUpTo = -1; barsFilled = false; ledgerFilled = false; ledgerArc = false;
    clearWet();
    clsBars.forEach(function(b){ b.el.style.width='0%'; });
    ledRows.forEach(function(r){ r.sBar.style.width='0%'; r.wBar.style.width='0%'; });
  }

  var cam = camera(t);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#080b0e'; ctx.fillRect(0,0,cv.width,cv.height);
  applyCam(cam, ctx);

  drawImageLayer(ctx, imgOrtho, track(t,[[0,0],[1.6,1],[86.5,1],[LOOP,0]]));

  var blkA = track(t,[[20.6,0],[23,0.82],[29,0.78],[33,0.42],[44,0.30],[83,0.26],[86,0]]);
  if(blkA>0.002){
    var wipe = seq(t, 20.6, 2.6);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, SW*wipe, SH); ctx.clip();
    drawImageLayer(ctx, imgBlk, blkA);
    if(wipe<1 && wipe>0){
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle='#39d2c0'; ctx.lineWidth=2.4/cam.s;
      ctx.beginPath(); ctx.moveTo(SW*wipe,0); ctx.lineTo(SW*wipe,SH); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  drawVectors(ctx, t, cam);
  drawThreat(ctx, t, cam);
  drawRoadLine(ctx, t, cam);
  drawCoverage(ctx, t, cam);

  ctx.globalAlpha = track(t,[[76.4,0],[78.5,1],[83,1],[86,0]]);
  ctx.drawImage(wet, 0, 0, SW, SH);
  ctx.globalAlpha = 1;

  drawDuty(ctx, t, cam);
  drawTowers(ctx, t, cam);
  drawEmbers(ctx, t, cam);

  // plates so the overlay type always has something to sit on
  ctx.setTransform(1,0,0,1,0,0);
  var gr = ctx.createLinearGradient(0, cv.height*0.42, 0, cv.height);
  gr.addColorStop(0,'rgba(6,9,12,0)'); gr.addColorStop(0.55,'rgba(6,9,12,0.55)'); gr.addColorStop(1,'rgba(6,9,12,0.92)');
  ctx.fillStyle=gr; ctx.fillRect(0, cv.height*0.42, cv.width, cv.height*0.58);
  var gt = ctx.createLinearGradient(0,0,0,cv.height*0.26);
  gt.addColorStop(0,'rgba(6,9,12,0.86)'); gt.addColorStop(1,'rgba(6,9,12,0)');
  ctx.fillStyle=gt; ctx.fillRect(0,0,cv.width,cv.height*0.26);
  var gs = ctx.createLinearGradient(cv.width*0.66,0,cv.width,0);
  gs.addColorStop(0,'rgba(6,9,12,0)'); gs.addColorStop(1,'rgba(6,9,12,0.55)');
  ctx.fillStyle=gs; ctx.fillRect(cv.width*0.66,0,cv.width*0.34,cv.height);

  /* ---- overlay ---- */
  var si = 0;
  for(var i=0;i<SCENES.length;i++) if(t>=SCENES[i].t) si=i;
  setScene(si);

  var clsOn = t>20 && t<86.5;
  els.cls.classList.toggle('on', clsOn);
  if(clsOn && !barsFilled){ barsFilled = true; clsBars.forEach(function(b){ b.el.style.width = b.pct+'%'; }); }

  var ledOn = t>58.8 && t<86.5;
  els.led.classList.toggle('on', ledOn);
  els.ledlbl.textContent = t>69 ? 'Per tower · what the sweep keeps' : 'Per tower · protected / wasted';
  if(ledOn && !ledgerFilled){
    ledgerFilled = true;
    ledRows.forEach(function(r){
      r.sBar.style.width = Math.round(74*(r.t.structure_m2/MAX_STRUCT))+'%';
      r.wBar.style.width = Math.round(26*(r.t.waste/0.5))+'%';
    });
  }
  if(ledOn){
    var shedN = Math.round(shedCount(t));
    ledRows.forEach(function(r){ r.el.classList.toggle('shed', r.t.rank>shedN); });
    if(t>71 && !ledgerArc){
      ledgerArc = true;
      ledRows.forEach(function(r){ r.wBar.style.width = Math.round(26*(r.t.wasteArc/0.5))+'%'; });
    }
  }

  els.prog.style.width = (t/LOOP*100).toFixed(2)+'%';
}

function reset(){
  prevLoopN = 0; firedUpTo = -1; lastScene = -1;
  barsFilled = false; ledgerFilled = false; ledgerArc = false;
  clearWet();
  clsBars.forEach(function(b){ b.el.style.width='0%'; });
  ledRows.forEach(function(r){ r.sBar.style.width='0%'; r.wBar.style.width='0%'; });
}
// jump to / draw a point in the loop — used when checking the film, inert in the deck
// an embedding deck restarts the film when the slide comes back into view
window.addEventListener('message', function(e){
  if(e && e.data && e.data.moat === 'restart'){ paused = false; t0 = performance.now()/1000; reset(); }
});

window.__moat = {
  loop: LOOP,
  restart: function(){ paused=false; t0 = performance.now()/1000; reset(); },
  now: function(){ return (performance.now()/1000 - t0) % LOOP; },
  scenes: SCENES.map(function(s){ return s.t; }),
  play: function(){ paused=false; },
  seek: function(s){ t0 = performance.now()/1000 - s; reset(); },
  step: function(s){
    paused = true;
    document.documentElement.classList.add('nofx');
    reset(); lastScene = -2;
    render(s, 0);
    var si=0; for(var i=0;i<SCENES.length;i++) if(s>=SCENES[i].t) si=i;
    var sc=SCENES[si];
    els.step.innerHTML=sc.step; els.head.innerHTML=sc.head; els.body.innerHTML=sc.body;
    [els.stepBox, els.head, els.body].forEach(function(e){ e.classList.add('on'); });
    if(s>20) clsBars.forEach(function(b){ b.el.style.width=b.pct+'%'; });
    if(s>58.8) ledRows.forEach(function(r){
      r.sBar.style.width = Math.round(74*(r.t.structure_m2/MAX_STRUCT))+'%';
      r.wBar.style.width = Math.round(26*((s>71?r.t.wasteArc:r.t.waste)/0.5))+'%';
    });
    return s;
  }
};

resize();
requestAnimationFrame(frame);
})();
</script>
